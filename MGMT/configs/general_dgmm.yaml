# DGMM — LLAMA2-7B + Tulu2
# Method: dgmm (Dynamic Gradient Manifold Masking)

model:
  name: LLM-Research/llama-2-7b
  use_lora: true
  lora_r: 16
  lora_alpha: 32

data:
  dataset: tulu
  max_length: 2048

training:
  output_dir: ./outputs/llama2_dgmm_tulu2
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  logging_steps: 10
  save_steps: 5000
  save_total_limit: 3
  seed: 42
  report_to: none

mask:
  method: dgmm
  # DGMM 不需要外部的 global_ratio 等参数;
  # per-layer keep ratio 由 DGMMFramework 内部统计公式计算
