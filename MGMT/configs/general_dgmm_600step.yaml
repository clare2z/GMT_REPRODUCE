# Smoke test: 2 optimizer steps only
model_name_or_path: "/root/autodl-tmp/model/llama-7b"
data_path: "/root/autodl-tmp/dataset/tulu-v2-sft-mixture"
output_dir: "/root/autodl-tmp/DGMM_600step"

model:
  use_flash_attention: false
  torch_dtype: "bfloat16"
  load_in_8bit: false
  load_in_4bit: false

mask:
  method: "dgmm"
  global_ratio: 0.0
  alpha: 0.0
  beta1: 0.9
  min_ratio: 0.0
  max_ratio: 0.0
  warmup_steps: 0
  dgmm:
    soft_alpha: 0.0
    late_start: 0
    keep_update_interval: 1
    ablate: ""

training:
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_seq_length: 2048
  logging_steps: 50
  save_steps: 100
  max_steps: 600
  save_strategy: "no"
  save_final_model: false
  bf16: true
  gradient_checkpointing: true
  optim: "adamw_8bit"
  dataloader_num_workers: 4

data:
  prompt_template: "tulu"

wandb: {}
